name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Run tests
        run: uv run pytest

      - name: Validate mender.yaml
        run: uv run mender validate --config mender.yaml

      # The corpus is the integration test: five broken repositories, five real
      # reproductions, five expected outcomes. A case that stops reaching its
      # expected outcome — including one that starts shipping a fix it should
      # have declined — fails the build.
      - name: Run the eval corpus
        run: uv run mender eval --corpus evals/corpus
